name: Publish to NPM

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Run unit tests
        run: yarn test:unit -- --run

      - name: Run e2e tests
        run: yarn test:e2e

      - name: Pack smoke check
        run: |
          for pkg in packages/core packages/plugin-memory packages/plugin-indexeddb packages/plugin-webdav; do
            echo "Packing $pkg"
            (cd "$pkg" && npm pack --json --dry-run)
          done

      - name: Publish core package
        run: cd packages/core && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish plugin packages
        run: |
          for pkg in packages/plugin-memory packages/plugin-indexeddb packages/plugin-webdav; do
            echo "Publishing $pkg"
            (cd "$pkg" && npm publish --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
